appId: law.legion.armory.librarius
productName: Legion Armory - Librarius
copyright: Copyright (c) 2026 Legion LegalTech
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # Main-process deps stay external (electron-vite externalizeDepsPlugin), so
  # production node_modules must ship with the installer.
  - node_modules/**/*
asarUnpack:
  - resources/**
# The bundled Tesseract binary is spawned as a child process, so it ships beside
# the app (process.resourcesPath/tesseract-win) rather than inside the asar.
extraResources:
  - from: resources/tesseract-win
    to: tesseract-win
# Puts Librarius in Explorer's "Open with" list for PDFs, so it can be set as
# the default PDF app. The NSIS macro writes to SHELL_CONTEXT, which follows the
# install mode — a per-user install (perMachine: false, no UAC) registers under
# HKCU\Software\Classes, the per-user association hive. Windows passes the
# double-clicked path as argv[1]; electron/services/open-files.ts reads it.
# No `icon:` — documents show the app's own icon rather than a missing file.
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LegionArmory-Librarius-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Librarius
