appId: com.legion.legionpdf
productName: Legion PDF
copyright: Copyright (c) 2026 Legion LegalTech
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # Main-process deps stay external (electron-vite externalizeDepsPlugin), so
  # production node_modules must ship with the installer.
  - node_modules/**/*
asarUnpack:
  - resources/**
# The bundled Tesseract binary is spawned as a child process, so it ships beside
# the app (process.resourcesPath/tesseract-win) rather than inside the asar.
extraResources:
  - from: resources/tesseract-win
    to: tesseract-win
# Puts Legion PDF in Explorer's "Open with" list for PDFs, so it can be set as
# the default PDF app. The NSIS macro writes to SHELL_CONTEXT, which follows the
# install mode — a per-user install (perMachine: false, no UAC) registers under
# HKCU\Software\Classes, the per-user association hive. Windows passes the
# double-clicked path as argv[1]; electron/services/open-files.ts reads it.
# No `icon:` — documents show the app's own icon rather than a missing file.
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
win:
  # The Legion "L", rasterised from resources/brand/fav.svg by
  # `npm run build:icon`. electron-builder converts this PNG into the multi-size
  # .ico it stamps on the exe, the installer, and the Start-menu shortcut, so
  # 512x512 with a transparent background is the input it wants.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LegionPDF-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Legion PDF
